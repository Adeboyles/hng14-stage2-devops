name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python linters
        run: pip install flake8

      - name: Lint Python - API
        run: flake8 api/main.py --max-line-length=100

      - name: Lint Python - Worker
        run: flake8 worker/worker.py --max-line-length=100

      - name: Install Node dependencies
        run: cd frontend && npm install

      - name: Install ESLint
        run: cd frontend && npm install eslint --save-dev

      - name: Lint JavaScript
        run: cd frontend && npx eslint app.js --env node --parser-options=ecmaVersion:2020 || true

      - name: Install hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          hadolint --ignore DL3013 --ignore DL3042 --ignore DL3008 api/Dockerfile
          hadolint --ignore DL3013 --ignore DL3042 --ignore DL3008 worker/Dockerfile
          hadolint --ignore DL3013 --ignore DL3042 --ignore DL3008 frontend/Dockerfile

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn redis pytest pytest-cov httpx

      - name: Run tests
        run: |
          pip install fastapi==0.111.0 uvicorn==0.29.0 redis==5.0.1 pytest pytest-cov httpx
          cd api
          pytest tests/test_main.py -v --cov=main --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2

      - name: Build and push API image
        run: |
          docker build -t localhost:5000/api:${{ github.sha }} -t localhost:5000/api:latest ./api
          docker push localhost:5000/api:${{ github.sha }}
          docker push localhost:5000/api:latest

      - name: Build and push Worker image
        run: |
          docker build -t localhost:5000/worker:${{ github.sha }} -t localhost:5000/worker:latest ./worker
          docker push localhost:5000/worker:${{ github.sha }}
          docker push localhost:5000/worker:latest

      - name: Build and push Frontend image
        run: |
          docker build -t localhost:5000/frontend:${{ github.sha }} -t localhost:5000/frontend:latest ./frontend
          docker push localhost:5000/frontend:${{ github.sha }}
          docker push localhost:5000/frontend:latest

      - name: Save image names
        run: |
          echo "localhost:5000/api:${{ github.sha }}" > image-tags.txt
          echo "localhost:5000/worker:${{ github.sha }}" >> image-tags.txt
          echo "localhost:5000/frontend:${{ github.sha }}" >> image-tags.txt

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2

      - name: Build images for scanning
        run: |
          docker build -t localhost:5000/api:latest ./api
          docker build -t localhost:5000/worker:latest ./worker
          docker build -t localhost:5000/frontend:latest ./frontend

      - name: Install Trivy
        run: |
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan API image
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --format sarif --output trivy-api.sarif localhost:5000/api:latest

      - name: Scan Worker image
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --format sarif --output trivy-worker.sarif localhost:5000/worker:latest

      - name: Scan Frontend image
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --format sarif --output trivy-frontend.sarif localhost:5000/frontend:latest

      - name: Upload SARIF results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: "*.sarif"

  integration-test:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          sleep 30
          docker compose ps

      - name: Submit a job
        run: |
          JOB_RESPONSE=$(curl -s -X POST http://localhost:3000/submit)
          echo "Job response: $JOB_RESPONSE"
          JOB_ID=$(echo $JOB_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      - name: Poll until job completes
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:3000/status/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "completed" ]; then
              echo "Job completed successfully!"
              exit 0
            fi
            sleep 2
          done
          echo "Job did not complete in time"
          exit 1

      - name: Tear down stack
        if: always()
        run: docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with rolling update
        run: |
          echo "Starting rolling update..."
          docker compose up --build -d --no-deps --scale api=2 api || true
          
          echo "Waiting for new container health check..."
          TIMEOUT=60
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q api) 2>/dev/null | head -1)
            echo "Health: $HEALTH (${ELAPSED}s)"
            if [ "$HEALTH" = "healthy" ]; then
              echo "New container is healthy, completing rollout..."
              docker compose up --build -d
              exit 0
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          
          echo "Health check failed within 60s, aborting deploy"
          exit 1
